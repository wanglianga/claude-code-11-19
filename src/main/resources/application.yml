server:
  port: 8080

spring:
  application:
    name: bookstore-member-migration
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:ccdev}
    username: ${DB_USER:ccdev}
    password: ${DB_PASSWORD:ccdev}
    hikari:
      maximum-pool-size: 8
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      encoding: UTF-8
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  # 启动时自动播种旧端样例数据（幂等；测试中通过 API 重置）
  seed-on-startup: true
  source-id: LEGACY-PRIMARY

logging:
  level:
    com.bookstore.migration: INFO
